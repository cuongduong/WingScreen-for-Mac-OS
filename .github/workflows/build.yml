# Build WingScreen.app (universal: Intel + Apple Silicon). Bản Windows nằm ở project WingScreen-Windows riêng.
# Cách dùng: đẩy mã nguồn lên GitHub -> tab Actions -> "Build WingScreen" -> Run workflow.
# Khi chạy xong, tải WingScreen-macOS.zip ở mục Artifacts.
# Đẩy tag dạng v2.0 (git tag v2.0 && git push --tags) để tự tạo Release.
name: Build WingScreen (macOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Khi build từ tag v2.1 -> phiên bản 2.1; nếu không thì lấy "version" trong about.json
  WINGSCREEN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app (Intel + Apple Silicon)
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --keepParent dist/WingScreen.app dist/WingScreen-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WingScreen-macOS
          path: dist/WingScreen-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*.zip
