# Build bộ cài + bản portable của WingScreen cho Windows.
# Chạy: tab Actions -> "Build WingScreen for Windows" -> Run workflow, hoặc đẩy tag v2.1 (tự tạo Release).
name: Build WingScreen for Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  WINGSCREEN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài / cập nhật Inno Setup
        shell: pwsh
        run: |
          # Bản dịch tiếng Việt cần Inno Setup 6.5 trở lên -> luôn cập nhật bản mới nhất
          choco upgrade innosetup -y --no-progress
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: WingScreen-Windows
          path: dist/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
